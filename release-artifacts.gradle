// Collects release APKs from every com.android.application module
// into build/release/ as <module-name>-release.apk, wiping stale output first.

def releaseArtifactsDir = layout.buildDirectory.dir("release")

def cleanReleaseArtifacts = tasks.register("cleanReleaseArtifacts", Delete) {
    group = "release"
    description = "Deletes previously collected release artifacts"
    delete(releaseArtifactsDir)
}

def collectArtifactTasks = []

subprojects { subproject ->
    subproject.plugins.withId("com.android.application") {
        def moduleName = subproject.name
        def moduleId = moduleName.replaceAll('[^A-Za-z0-9]', '').capitalize()
        def collectTaskName = "collectReleaseArtifacts${moduleId}"
        def moduleOutputsDir = subproject.layout.buildDirectory.dir("outputs/apk")
        def assembleReleaseTasks = subproject.tasks.matching { it.name == "assembleRelease" }

        def collectTask = tasks.register(collectTaskName, Copy) {
            group = "release"
            description = "Collects release APK for ${moduleName}"

            dependsOn(cleanReleaseArtifacts)
            dependsOn(assembleReleaseTasks)

            from(moduleOutputsDir) {
                include("**/release/*.apk")

                eachFile { f ->
                    f.path = "${moduleName}-release.apk"
                }

                includeEmptyDirs = false
            }

            into(releaseArtifactsDir)
        }

        collectArtifactTasks.add(collectTask)
    }
}

tasks.register("collectAllReleaseArtifacts") {
    group = "release"
    description = "Collects release APKs from all Android app modules"
    dependsOn(collectArtifactTasks)
}