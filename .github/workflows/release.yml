name: Release

# Release by pushing a tag. The suffix after "-v" is only for uniqueness
# (git can't reuse a tag), so any counter or date works:
#
#   All plugins:  v<anything>
#     git tag v1 && git push origin v1
#
#   One plugin:   <module-name>-v<digit...>
#     git tag plugin-btn-ocr-v1 && git push origin plugin-btn-ocr-v1
#
# The digit right after "-v" is required for single-plugin tags.
# Version name/code come from the build date and run number, not the tag.
#
# Manual: Actions > Release > Run workflow > "all" or a module name.

on:
  push:
    tags:
      - "v*"
      - "plugin-*-v*"
  workflow_dispatch:
    inputs:
      module:
        description: "Module name (plugin-btn-ocr) or 'all'"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Create local.properties
        run: |
          printf 'ext.PROP_KEY_ALIAS = System.getenv("KEY_ALIAS")\next.PROP_STORE_PASSWORD = System.getenv("KEYSTORE_PASSWORD")\n' > "$RUNNER_TEMP/signing.gradle"
          printf 'keystore=%s\nkeystore.signing=%s\n' "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/signing.gradle" > local.properties

      - name: Publish to Play
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_MODULE: ${{ inputs.module }}
          # Space-separated modules with no Play Console app yet
          EXCLUDE_MODULES: "plugin-btn-barcode plugin-btn-imgbb"
        run: |
          export RELEASE_SEQ=$((RUN_NUMBER % 100))
          REF="${INPUT_MODULE:-$GITHUB_REF_NAME}"
          chmod +x gradlew

          write_notes() {
            DIR="$1/src/main/play/release-notes/en-US"
            mkdir -p "$DIR"
            printf 'Bug fixes and improvements.\n' > "$DIR/default.txt"
          }

          if [[ "$REF" == plugin-* ]]; then
            MODULE="${REF%-v[0-9]*}"
            write_notes "$MODULE"
            ./gradlew ":${MODULE}:publishReleaseBundle"
          else
            SKIP=""
            for m in $EXCLUDE_MODULES; do SKIP="$SKIP -x :$m:publishReleaseBundle"; done
            for d in plugin-*/; do write_notes "${d%/}"; done
            ./gradlew publishReleaseBundle $SKIP --continue
          fi