name: Build Android Plugins

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download missing TOML file
      run: curl -sL https://raw.githubusercontent.com/damionx7/Zettel-Notes/master/gradle/libs.versions.toml -o gradle/libs.versions.toml --create-dirs

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APKs
      run: ./gradlew assembleDebug

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-apks
        path: '**/build/outputs/apk/**/*.apk'
