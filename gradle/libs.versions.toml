[versions]
agp = '9.3.2'
flexmark = "0.64.8"
markwon = '4.6.2'
okhttp = "5.5.0"
retrofit = "3.0.0"
room = "2.8.4"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version = "2.0.1" }

[libraries]
anki-android = { module = "com.github.ankidroid:Anki-Android", version = "api-v1.1.0" }
button-api = { module = "com.github.damionx7:Zettel-Notes-Plugin-Api", version = "28" }
cardviewx = { module = "androidx.cardview:cardview", version = "1.0.0" }
chat-gpt-api = { module = "com.cjcrafter:openai", version = "2.1.1" }
commons-text = { group = "org.apache.commons", name = "commons-text", version = "1.15.0" }
constraintx = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version = "2.1.5" }
flexmark = { module = "com.vladsch.flexmark:flexmark", version.ref = "flexmark" }
flexmark-ext-gfm-strikethrough = { module = "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough", version.ref = "flexmark" }
flexmark-ext-gfm-tasklist = { module = "com.vladsch.flexmark:flexmark-ext-gfm-tasklist", version.ref = "flexmark" }
flexmark-ext-tables = { module = "com.vladsch.flexmark:flexmark-ext-tables", version.ref = "flexmark" }
gms-location = { group = "com.google.android.gms", name = "play-services-location", version = "21.4.0" }
google-ai-litertlm = { module = "com.google.ai.edge.litertlm:litertlm-android", version = "0.16.1" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
jetbrains-kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.11.0" }
jetbrains-kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-bom = { group = "org.junit", name = "junit-bom", version = "6.1.3" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-editor = { module = "io.noties.markwon:editor", version.ref = "markwon" }
markwon-html = { module = "io.noties.markwon:html", version.ref = "markwon" }
markwon-image = { module = "io.noties.markwon:image", version.ref = "markwon" }
markwon-inline-parser = { module = "io.noties.markwon:inline-parser", version.ref = "markwon" }
markwon-linkify = { module = "io.noties.markwon:linkify", version.ref = "markwon" }
markwon-recycler = { module = "io.noties.markwon:recycler", version.ref = "markwon" }
markwon-strikethrough = { module = "io.noties.markwon:ext-strikethrough", version.ref = "markwon" }
markwon-syntax-highlight = { module = "io.noties.markwon:syntax-highlight", version.ref = "markwon" }
markwon-tables = { module = "io.noties.markwon:ext-tables", version.ref = "markwon" }
markwon-tasklist = { module = "io.noties.markwon:ext-tasklist", version.ref = "markwon" }
material = { module = "com.google.android.material:material", version = "1.14.0" }
mlkit-doc-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version = "16.0.0" }
mlkit-language-id = { module = "com.google.mlkit:language-id", version = "17.0.6" }
mlkit-translate = { module = "com.google.mlkit:translate", version = "17.0.3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
paging = { group = "androidx.paging", name = "paging-runtime-ktx", version = "3.5.1" }
preferencex = { module = "androidx.preference:preference", version = "1.2.1" }
recyclerviewx = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16.1" }
room-annotation-processor = { module = "androidx.room:room-compiler", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
tesseract = { module = "cz.adaptech.tesseract4android:tesseract4android", version = "4.9.0" }
vosk = { module = "com.alphacephei:vosk-android", version = "0.3.75" }
workx = { module = "androidx.work:work-runtime", version = "2.11.2" }
zxing = { module = "com.google.zxing:core", version = "3.5.4" }
zxing-scanner = { module = 'com.journeyapps:zxing-android-embedded', version = '4.3.0' }

[bundles]
junit = ["junit-api", "junit-engine", "junit-params", "robolectric"]
markwon = ["markwon-core", "markwon-editor", "markwon-html", "markwon-tables", "markwon-linkify", "markwon-strikethrough",
    "markwon-syntax-highlight", "markwon-image", "markwon-recycler", "markwon-inline-parser"]
mlkit = ["mlkit-translate", "mlkit-language-id"]
room = ["room-runtime", "room-paging"]